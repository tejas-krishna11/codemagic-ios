workflows:
  rose-unsigned-ipa:
    name: Rose unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Show Xcode / Swift version
        script: |
          xcodebuild -version
          swift --version
      - name: Build unsigned IPA
        script: |
          cd Rose-iOS
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh Release
    artifacts:
      - Rose-iOS/build/Rose.ipa
